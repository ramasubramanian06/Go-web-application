
apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt-learning
  namespace: k8sgpt
spec:
  ai:
    enabled: false
    backend: openai
    anonymized: true
    autoRemediation:
      enabled: false
      resources:
        - Pod
        - Deployment
      similarityRequirement: ""
    backOff:
      enabled: false
      maxRetries: 5
    language: english
    maxTokens: "2048"
    model: gpt-4o-mini
    topk: "50"
  analysis:
    interval: 5m
  filters:
    - Pod
    - Deployment
    - Service
  noCache: true
  repository: ghcr.io/k8sgpt-ai/k8sgpt
  version: latest

